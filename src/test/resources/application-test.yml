spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  liquibase:
    enabled: false
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/test_hotel_booking_stats
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-hotel-booking-stats
      auto-offset-reset: earliest

logging:
  level:
    com.hotelbooking: DEBUG
