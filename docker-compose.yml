version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hotel_booking_postgres
    environment:
      POSTGRES_DB: hotel_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_booking_network

  mongodb:
    image: mongo:7
    container_name: hotel_booking_mongodb
    environment:
      MONGO_INITDB_DATABASE: hotel_booking_stats
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hotel_booking_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: hotel_booking_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotel_booking_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: hotel_booking_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - hotel_booking_network

  app:
    build: .
    container_name: hotel_booking_app
    depends_on:
      - postgres
      - mongodb
      - kafka
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_booking_db
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/hotel_booking_stats
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - hotel_booking_network

volumes:
  postgres_data:
  mongodb_data:

networks:
  hotel_booking_network:
    driver: bridge
